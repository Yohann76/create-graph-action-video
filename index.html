<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Investment Graph</title>
<script src="d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    background: #ffffff;
    overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 90px 60px 0;
    gap: 55px;
  }

  #tiktok-bar {
    flex-shrink: 0;
    width: calc(100% + 120px); /* 100% content + 2×60px body padding */
    margin: 0 -60px;
    height: 260px;
    background: #000000;
  }

  #headline {
    flex-shrink: 0;
    width: 100%;
    font-size: 52px;
    font-weight: 900;
    color: #111;
    text-align: center;
    line-height: 1.42;
    white-space: pre-line;
    letter-spacing: -0.5px;
  }

  #graph-wrapper {
    flex: 1;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: flex-end;   /* SVG colle vers la bande noire du bas */
    justify-content: center;
    padding-bottom: 30px;    /* petit espace entre le graph et la barre */
  }

  /* ── Axes ── */
  .axis text {
    font-weight: 900;
    fill: #000;
    font-family: inherit;
  }
  .x-axis text { font-size: 32px; }
  .y-axis text { font-size: 32px; }
  .axis path,
  .axis line {
    stroke: #000;
    stroke-width: 7px;
    shape-rendering: crispEdges;
  }

  /* ── Grid ── */
  .grid line, .x-grid line {
    stroke: #e0e0e0;
    stroke-width: 1px;
  }
  .grid path, .x-grid path { display: none; }

  /* ── Dot labels & values (right of curves) ── */
  .dot-label {
    font-size: 21px;
    font-weight: 900;
    font-family: inherit;
  }
  .dot-value {
    font-size: 26px;
    font-weight: 900;
    font-family: inherit;
  }
</style>
</head>
<body>

<div id="headline"></div>
<div id="graph-wrapper"></div>
<div id="tiktok-bar"></div>

<script>
(async () => {
  // ── Load data ─────────────────────────────────────────────────────────────
  const res      = await fetch('_computed.json');
  const scenario = await res.json();
  const { text, video, computed } = scenario;
  const { series, currency } = computed;

  // ── Headline (optional — hidden if empty or missing) ──────────────────────
  const hl = document.getElementById('headline');
  const headlineText = (text.headline || '').trim();
  if (headlineText) {
    hl.textContent    = headlineText;
    hl.style.fontSize = (text.font_size || 52) + 'px';
    hl.style.color    = text.color || '#111';
  } else {
    hl.style.display = 'none';
  }

  // ── Currency formatter ────────────────────────────────────────────────────
  const SYM = { USD: '$', EUR: '€', GBP: '£', JPY: '¥', CHF: 'Fr.' };
  const sym = SYM[currency] || (currency + ' ');
  function fmtVal(v) {
    if (v >= 1e6)  return sym + (v / 1e6).toFixed(2) + 'M';
    if (v >= 1e3)  return sym + (v / 1e3).toFixed(1) + 'K';
    return sym + Math.round(v);
  }

  // ── Dimensions ────────────────────────────────────────────────────────────
  const wrapper = document.getElementById('graph-wrapper');
  const W = wrapper.clientWidth;
  const margin = { top: 30, right: 185, bottom: 120, left: 145 };
  const iW  = W - margin.left - margin.right;  // chart inner width
  const iH  = iW;                              // square chart: Y height = X length
  const svgH = iH + margin.top + margin.bottom;

  const svg = d3.select('#graph-wrapper')
    .append('svg').attr('width', W).attr('height', svgH);
  const g = svg.append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

  // ── Data ──────────────────────────────────────────────────────────────────
  const startIdx = series.findIndex(d => d.invested > 0);
  const data = startIdx >= 0 ? series.slice(startIdx) : series;

  const startDate = new Date(data[0].date);
  const endDate   = new Date(data[data.length - 1].date);

  // ── Curve definitions ─────────────────────────────────────────────────────
  const companyName = text.company_name || computed.ticker;
  const C = { invested: '#E53935', value: '#00C853' };
  const curveDefs = [
    { key: 'invested',       color: C.invested, label: ['Montant investi'], sw: 5 },
    { key: 'value_with_div', color: C.value,    label: [companyName],       sw: 7 },
  ];

  // ── Scales (both dynamic, updated each frame) ─────────────────────────────
  // xScale: [startDate, currentDate] → [0, iW]  — grows as animation progresses
  // yScale: [0, currentMax * 1.1]   → [iH, 0]  — same logic as before
  const xScale = d3.scaleTime().range([0, iW]);
  const yScale = d3.scaleLinear().range([iH, 0]);

  // ── Path generators ───────────────────────────────────────────────────────
  const lineGen = key => d3.line()
    .x(d => xScale(new Date(d.date)))
    .y(d => yScale(d[key]))
    .curve(d3.curveCatmullRom.alpha(0.5));

  // ── SVG layer order: grids → axes → curves → dots → labels ───────────────
  const gridG  = g.append('g').attr('class', 'grid');
  const xGridG = g.append('g').attr('class', 'x-grid').attr('transform', `translate(0,${iH})`);
  const xAxisG = g.append('g').attr('class', 'axis x-axis').attr('transform', `translate(0,${iH})`);
  const yAxisG = g.append('g').attr('class', 'axis y-axis');

  // Curve lines (no clipPath — paths drawn only up to currentData)
  const lineEls = {};
  curveDefs.forEach(c => {
    lineEls[c.key] = g.append('path')
      .attr('fill', 'none')
      .attr('stroke', c.color)
      .attr('stroke-width', c.sw)
      .attr('stroke-linecap', 'round')
      .attr('stroke-linejoin', 'round')
      .attr('stroke-dasharray', c.key === 'invested' ? '10 7' : null);
  });

  // Dots at the drawing tip (outside clip — always visible at edge)
  const dotEls = {};
  curveDefs.forEach(c => {
    dotEls[c.key] = g.append('circle')
      .attr('r', 11).attr('fill', c.color)
      .attr('stroke', '#ffffff').attr('stroke-width', 3)
      .attr('cx', -60).attr('cy', -60);
  });

  // Labels + dynamic values (follow dot horizontally)
  const LINE_H  = 26;
  const VALUE_H = 34;
  const labelEls = {}, valueEls = {};
  curveDefs.forEach(c => {
    labelEls[c.key] = c.label.map(txt =>
      g.append('text')
        .attr('class', 'dot-label')
        .attr('fill', c.color)
        .attr('y', -60)
        .text(txt)
    );
    valueEls[c.key] = g.append('text')
      .attr('class', 'dot-value')
      .attr('fill', c.color)
      .attr('y', -60);
  });

  // ── Animation ─────────────────────────────────────────────────────────────
  const totalDuration = (video.duration_seconds || 12) * 1000;
  const sStep      = Math.max(1, Math.floor(data.length / 400));
  let   smoothYMax = 1;

  setTimeout(() => {
    const t0 = performance.now();

    function frame(now) {
      const elapsed   = now - t0;
      const progress  = Math.min(elapsed / totalDuration, 1);
      const currentIdx  = Math.min(Math.floor(progress * (data.length - 1)), data.length - 1);
      const currentData = data.slice(0, Math.max(2, currentIdx + 1));
      const last        = currentData[currentData.length - 1];

      // ── Dynamic X scale: currentDate at 90% of width (10% right headroom) ───
      const currentDate = new Date(last.date);
      const timeSpan = currentDate.getTime() - startDate.getTime();
      const xEndDate  = new Date(startDate.getTime() + timeSpan / 0.9);
      xScale.domain([startDate, xEndDate]);

      const dotX = xScale(currentDate); // ≈ 90% of iW

      // ── Dynamic Y scale ───────────────────────────────────────────────────
      const rawYMax = Math.max(1, d3.max(currentData, d => Math.max(
        d.invested, d.value_with_div
      )));
      const targetCeiling = rawYMax * 1.1;
      smoothYMax += (targetCeiling - smoothYMax) * 0.05;
      if (smoothYMax < rawYMax) smoothYMax = rawYMax;
      yScale.domain([0, smoothYMax]);

      // ── Redraw curves (currentData only — paths end at currentDate) ────────
      const sampled = currentData.filter((_, i, arr) =>
        i % sStep === 0 || i === arr.length - 1
      );
      curveDefs.forEach(c => {
        lineEls[c.key].attr('d', lineGen(c.key)(sampled));
      });

      // ── Y axis + horizontal grid ───────────────────────────────────────────
      gridG.call(d3.axisLeft(yScale).ticks(4).tickSize(-iW).tickFormat(''));
      yAxisG.call(d3.axisLeft(yScale).ticks(4).tickFormat(fmtVal).tickSize(10));

      // ── X axis + vertical grid: smart tick selection ──────────────────────
      const histYears = d3.timeYear.range(
        d3.timeYear.ceil(startDate),
        d3.timeYear.offset(currentDate, 1)
      ).filter(d => d <= currentDate);
      const tickStep  = histYears.length > 5 ? 2 : 1;
      const xTicks    = histYears.filter((_, i) => i % tickStep === 0);
      xGridG.call(
        d3.axisBottom(xScale).tickValues(xTicks).tickFormat('').tickSize(-iH)
      );
      xAxisG.call(
        d3.axisBottom(xScale)
          .tickValues(xTicks)
          .tickFormat(d3.timeFormat('%Y'))
          .tickSize(10)
      );
      xAxisG.selectAll('.tick text')
        .style('text-anchor', 'end')
        .attr('transform', 'rotate(-40)')
        .attr('dx', '-0.6em')
        .attr('dy', '0.05em');

      // ── Dots at right edge ─────────────────────────────────────────────────
      curveDefs.forEach(c => {
        dotEls[c.key].attr('cx', dotX).attr('cy', yScale(last[c.key]));
      });

      // ── Labels + values: anchored right of dot, collision avoidance ────────
      const LX = dotX + 18;
      const positions = curveDefs.map(c => ({
        key: c.key, adjY: yScale(last[c.key]), nLines: c.label.length,
      }));
      positions.sort((a, b) => a.adjY - b.adjY);
      for (let i = 1; i < positions.length; i++) {
        const prev   = positions[i - 1];
        const needed = prev.adjY + (prev.nLines * LINE_H) + VALUE_H + 10;
        if (positions[i].adjY < needed) positions[i].adjY = needed;
      }
      const posMap = Object.fromEntries(positions.map(p => [p.key, p.adjY]));
      curveDefs.forEach(c => {
        const baseY = posMap[c.key];
        labelEls[c.key].forEach((el, i) =>
          el.attr('x', LX).attr('y', baseY + i * LINE_H)
        );
        valueEls[c.key]
          .attr('x', LX)
          .attr('y', baseY + c.label.length * LINE_H + 6)
          .text(fmtVal(last[c.key]));
      });

      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        setTimeout(() => { window.__RENDER_DONE__ = true; }, 700);
      }
    }

    requestAnimationFrame(frame);
  }, 400);

})();
</script>
</body>
</html>
